---
name: test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-unit:
    uses: acep-devops/cookbook-ci/.github/workflows/lint-unit.yml@main
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write
      contents: read
      id-token: write

  determine-matrix:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set-matrix.outputs.platforms }}

    steps:
      - uses: actions/checkout@v4

      - name: Parse Kitchen Platforms
        id: set-matrix
        run: |
          sudo apt-get update
          sudo apt-get install -y jq yq
          platforms=$(yq '.platforms[].name' kitchen.yml | jq -R . | jq -c -s .)
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

  integration:
    runs-on: ubuntu-latest
    needs: [lint-unit, determine-matrix]
    strategy:
      matrix:
        os: ${{ fromJson(needs.determine-matrix.outputs.platforms) }}
        suite:
          - default
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Chef
        uses: actionshub/chef-install@3.0.0
      - name: Test-Kitchen
        uses: actionshub/test-kitchen@main
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}
        env:
          CHEF_LICENSE: accept-no-persist
